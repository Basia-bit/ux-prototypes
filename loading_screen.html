<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orange ES — Loading screen (prototype)</title>
<style>
  :root {
    --orange: #ff7900;
    --ink: #0b0b0b;
    --muted: #6b6b6b;
    --green: #1e9e63;
    --card: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #e9e9ee;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Mobile frame, like the Orange screen */
  .phone {
    width: 390px;
    height: 760px;
    background: var(--card);
    border-radius: 36px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Top bar: plain black, no branding */
  .topbar {
    height: 48px;
    background: #000;
    flex-shrink: 0;
  }

  /* Content */
  .content {
    flex: 1;
    padding: 34px 28px 24px;
    display: flex;
    flex-direction: column;
  }

  /* Original window illustration from the Orange screen */
  .scene {
    width: 100%;
    height: 200px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    margin-bottom: 28px;
    background: #ff7900;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 4s ease-in-out infinite;
  }
  .scene img {
    width: 86%;
    height: auto;
    display: block;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }

  /* Heading + sub */
  h1 {
    font-size: 25px;
    line-height: 1.2;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .sub {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 26px;
  }

  /* Progress: thin determinate-looking bar that fills smoothly, no jumping */
  .barwrap {
    height: 7px;
    background: #eee;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), #ffb15a);
    border-radius: 999px;
    animation: fill 2.1s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes fill { 0% { width: 6%; } 100% { width: 100%; } }

  /* Step checklist — tasks tick off one by one */
  .steps { list-style: none; display: flex; flex-direction: column; gap: 15px; }
  .step {
    display: flex;
    align-items: center;
    gap: 13px;
    font-size: 15px;
    color: #bdbdbd;
    transition: color .35s ease;
  }
  .step .tick {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid #dcdcdc;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: #fff;
    transition: all .35s ease;
  }
  .step .tick svg { width: 13px; height: 13px; opacity: 0; transition: opacity .3s ease; }

  .step.active { color: var(--ink); font-weight: 600; }
  .step.active .tick {
    border-color: var(--orange);
    border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .step.done { color: var(--ink); }
  .step.done .tick {
    border-color: var(--green);
    background: var(--green);
    animation: none;
  }
  .step.done .tick svg { opacity: 1; }

  /* reassurance line — bigger, more present */
  .reassure {
    margin-top: auto;
    padding-top: 20px;
    font-size: 16px;
    font-weight: 600;
    color: #3a3a3a;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }

  /* Replay button (prototype aid, not part of the design) */
  .replay {
    position: absolute;
    bottom: 14px; right: 16px;
    font-size: 11px;
    color: #bbb;
    background: transparent;
    border: 1px solid #e0e0e0;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .replay:hover { color: var(--orange); border-color: var(--orange); }
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar"></div>

    <div class="content">
      <div class="scene">
        <img src="assets/window.png" alt="Window with a sunny sky">
      </div>

      <h1>Sit back &mdash; your quote is on its way</h1>
      <p class="sub">We&rsquo;re pulling your property details together and running the numbers to find you the best price.</p>

      <div class="barwrap"><div class="bar"></div></div>

      <ul class="steps">
        <li class="step" data-step="0">
          <span class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Reading your property details</span>
        </li>
        <li class="step" data-step="1">
          <span class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Checking your cover options</span>
        </li>
        <li class="step" data-step="2">
          <span class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Calculating your best price</span>
        </li>
      </ul>

      <div class="reassure"><span class="dot"></span> This only takes a moment</div>
    </div>

    <button class="replay" onclick="runSequence()">Replay</button>
  </div>

<script>
  const steps = Array.from(document.querySelectorAll('.step'));
  const bar = document.querySelector('.bar');

  function reset() {
    steps.forEach(s => s.classList.remove('active', 'done'));
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = '';
  }

  function runSequence() {
    reset();
    const timings = [0, 700, 1400];
    const total = 2100;

    steps.forEach((step, i) => {
      setTimeout(() => {
        if (i > 0) {
          steps[i - 1].classList.remove('active');
          steps[i - 1].classList.add('done');
        }
        step.classList.add('active');
      }, timings[i]);
    });

    setTimeout(() => {
      steps[steps.length - 1].classList.remove('active');
      steps[steps.length - 1].classList.add('done');
    }, total);
  }

  runSequence();
</script>
</body>
</html>
